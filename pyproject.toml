[project]
name = "auto-mapper"
version = "0.1.0"
description = "Lightform-style projection mapper engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "opencv-contrib-python>=5.0.0.93",
    "numpy>=2.5.3",
    "pyobjc-framework-avfoundation>=12.2.2 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
