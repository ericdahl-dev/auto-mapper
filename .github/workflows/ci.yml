name: CI

# Engine tests (pytest, fake hardware), frontend type-check, unit + browser tests
# (headless Chromium, SwiftShader WebGL, fake microphone) and production build.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: OpenCV system library
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python 3.12
      - name: Test
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Browser for tests
        run: npx playwright install --with-deps chromium
      - name: Type-check
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run
      - name: Build
        run: npx vite build
