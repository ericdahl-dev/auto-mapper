name: American spelling

# The product, docs and code use American spelling (color, center, canceled, analyze...).
# Uses the org's spelling-dialect action; the org ruleset also requires the same check.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spelling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ericdahl-dev/spelling-dialect@v1
        with:
          dialect: american
