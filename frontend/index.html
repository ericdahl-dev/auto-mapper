<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>auto-mapper</title>
    <style>
      :root { color-scheme: dark; --bg: #111; --panel: #1b1b1b; --line: #2c2c2c; --text: #ddd; --muted: #888; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
      header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
      h1 { font-size: 16px; margin: 0 auto 0 0; }
      main { display: grid; grid-template-columns: 1fr 280px; gap: 16px; padding: 16px; }
      /* Image and overlay share one box with the scan's aspect ratio, so polygons line up. */
      #scan-view { position: relative; max-width: 100%; max-height: 100%; width: 100%; }
      #scan-view[hidden] { display: none; }
      #scan-view img, #scan-view svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #surfaces polygon { cursor: pointer; vector-effect: non-scaling-stroke; }
      #surface-panel { border-top: 1px solid var(--line); padding-top: 12px; margin-bottom: 12px; }
      .control { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; margin-bottom: 8px; }
      .control input[type=range] { grid-column: 1 / -1; width: 100%; }
      #effect-error { color: var(--bad); white-space: pre-wrap; font-size: 12px; background: #2a1414; padding: 8px; }
      #surfaces polygon { fill: rgba(37, 99, 235, 0.18); stroke: #60a5fa; stroke-width: 2; }
      #surfaces polygon.selected { fill: rgba(255, 255, 255, 0.25); stroke: #fff; stroke-width: 3; }
      #surfaces polygon.error { stroke: #f87171; stroke-width: 3; }
      #surfaces polygon.multi { stroke: #fbbf24; stroke-width: 3; }
      #surfaces circle.handle { fill: #fff; stroke: #111; stroke-width: 2; vector-effect: non-scaling-stroke; cursor: move; }
      #surface-name { width: 100%; background: #262626; color: var(--text); border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px; }
      .hint { font-size: 12px; margin: 0 0 8px; }
      #surfaces text { pointer-events: none; fill: #fff; font: 600 28px system-ui, sans-serif; paint-order: stroke; stroke: #000; stroke-width: 4px; }
      .muted { color: var(--muted); margin: 8px 0 0; }
      .stage { aspect-ratio: 16 / 9; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
      aside { background: var(--panel); border: 1px solid var(--line); padding: 12px; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0 0 16px; }
      dt { color: var(--muted); }
      dd { margin: 0; }
      .ok { color: var(--ok); } .bad { color: var(--bad); }
      .banner { background: #3a2a05; color: var(--warn); border-left: 3px solid var(--warn); padding: 8px 16px; }
      button { background: #262626; color: var(--text); border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      button.primary { background: #2563eb; border-color: #2563eb; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
      select { width: 100%; background: #262626; color: var(--text); border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px; }
      #preview { width: 100%; border: 1px solid var(--line); margin-bottom: 12px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>auto-mapper</h1>
      <button id="open-output">Open output window</button>
      <button id="refresh">Refresh hardware</button>
      <button id="scan" class="primary" disabled>Scan</button>
    </header>
    <div id="banners"></div>
    <main>
      <div>
        <div class="stage">
          <div id="scan-view" hidden>
            <img id="scan-image" alt="Scan" />
            <svg id="surfaces" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
          </div>
          <span id="stage-empty">Scan image appears here after a scan.</span>
        </div>
        <p id="scan-label" class="muted">No scan yet</p>
      </div>
      <aside>
        <h2>Hardware</h2>
        <dl>
          <dt>Projector</dt><dd id="projector">…</dd>
          <dt>Cameras</dt><dd id="cameras">…</dd>
          <dt>Output</dt><dd id="output">…</dd>
        </dl>
        <h2>Camera</h2>
        <div class="row"><select id="camera-select"></select></div>
        <div class="row">
          <button id="preview-toggle">Show preview</button>
          <button id="calibrate">Calibrate exposure</button>
        </div>
        <dl><dt>Exposure</dt><dd id="calibration">…</dd></dl>
        <img id="preview" alt="Camera preview" hidden />
        <section id="surface-panel" hidden>
          <h2 id="surface-title">Surface</h2>
          <div class="row"><input id="surface-name" type="text" placeholder="Name" /></div>
          <div class="row">
            <button id="delete-surface">Delete</button>
            <button id="merge-surfaces" hidden>Merge selected</button>
          </div>
          <p class="muted hint">Drag corners to adjust. Double-click an edge to add a corner, Alt-click a corner to remove it. Shift-click surfaces to merge them.</p>
          <div class="row"><select id="effect-select"></select></div>
          <div id="effect-controls"></div>
          <pre id="effect-error" hidden></pre>
        </section>
        <h2>Test frame</h2>
        <div class="row">
          <button data-test-frame="grid">Grid</button>
          <button data-test-frame="white">White</button>
          <button data-test-frame="black">Black</button>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
