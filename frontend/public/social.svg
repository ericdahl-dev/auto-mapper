<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16181d"/><stop offset="1" stop-color="#0b0c0f"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.32"/><stop offset="1" stop-color="#fff" stop-opacity="0.04"/></linearGradient>
    <linearGradient id="fillA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="fillB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="gray" width="24" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#e5e7eb"/></pattern>
    <clipPath id="arch"><path d="M436 470 L436 330 A60 60 0 0 1 556 330 L556 470 Z"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- wall surfaces, unmapped -->
  <path d="M250 110 L640 80 L640 560 L250 540 Z" fill="#1f232b"/>
  <!-- projector beam -->
  <path d="M70 560 L640 60 L640 590 Z" fill="url(#beam)"/>
  <!-- mapped surfaces -->
  <path d="M290 140 L420 128 L420 300 L290 306 Z" fill="url(#fillA)"/>
  <path d="M450 122 L600 110 L600 260 L450 268 Z" fill="none" stroke="#a78bfa" stroke-width="14" filter="url(#glow)"/>
  <path d="M450 122 L600 110 L600 260 L450 268 Z" fill="none" stroke="#ddd6fe" stroke-width="4"/>
  <path d="M290 336 L410 332 L410 500 L290 506 Z" fill="url(#gray)"/>
  <rect x="436" y="270" width="120" height="200" fill="url(#fillB)" clip-path="url(#arch)"/>
  <!-- projector -->
  <rect x="38" y="548" width="74" height="40" rx="8" fill="#2a2e37"/>
  <circle cx="70" cy="560" r="14" fill="#fff"/>
  <!-- text -->
  <text x="700" y="270" fill="#f3f4f6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="68" font-weight="700">auto-mapper</text>
  <text x="702" y="330" fill="#9ca3af" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30">Automatic projection mapping</text>
  <text x="702" y="372" fill="#9ca3af" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30">with a projector and a webcam.</text>
  <text x="702" y="450" fill="#6b7280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24">Scan · find surfaces · map live effects</text>
</svg>
